name: Rotate Excuse of the Day

on:
  schedule:
    # Runs daily at 00:00 UTC (07:00 UTC+7)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate-excuse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rotate excuse in README.md
        run: python3 scripts/rotate_excuse.py

      - name: Commit and push updated README
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: rotate excuse of the day"
          git push
